name: rental-company

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rental_company
      POSTGRES_USER: rental
      POSTGRES_PASSWORD: RentalDb123!
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=rental_company;Username=rental;Password=RentalDb123!
      DataProtection__KeysPath: /home/app/.aspnet/DataProtection-Keys
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - data_protection:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  data_protection:
